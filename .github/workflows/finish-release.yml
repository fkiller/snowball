name: Verify and finish prepared release
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: Existing unpublished alpha tag
      source_run:
        required: true
        type: string
        description: Failed publish run whose build and security jobs all passed
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          test "$TAG" = "v$(node -p "require('./package.json').version")"
          COMMIT=$(git rev-parse HEAD)
          test "$COMMIT" = "$(git rev-parse "$TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > /tmp/run.json
          jq -e --arg sha "$COMMIT" '.head_sha == $sha and .status == "completed" and .name == "Publish both products"' /tmp/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > /tmp/jobs.json
          jq -e '.jobs | length == 11 and all(.[]; .status == "completed" and (if .name == "publish" then .conclusion == "failure" else .conclusion == "success" end))' /tmp/jobs.json
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          path: source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          pattern: release-*
          merge-multiple: true
          path: source/artifacts/releases
      - name: Verify draft and publish exact previously tested artifacts
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          node ../tools/prepare-release-manifest.mjs
          gh release view "$TAG" --json isDraft | jq -e '.isDraft == true'
          gh release upload "$TAG" artifacts/releases/release-manifest.json --clobber
          node ../tools/verify-release-downloads.mjs "$GITHUB_REPOSITORY" "$TAG" "$COMMIT"
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          env -u GH_TOKEN node ../tools/verify-release-downloads.mjs "$GITHUB_REPOSITORY" "$TAG" "$COMMIT"
