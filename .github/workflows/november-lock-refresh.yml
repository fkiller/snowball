name: Resolve November maintenance dependency locks
on:
  push:
    branches: [codex/november-lock-refresh]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bundler: [current-vinext, root-worker-chunks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
      - name: Resolve the patched dependencies without installation scripts
        env:
          BUNDLER: ${{ matrix.bundler }}
        run: |
          npm pkg set devDependencies.react-server-dom-webpack=19.3.1 devDependencies.vite=8.3.8 devDependencies.typescript-eslint=8.73.0 devDependencies.@cloudflare/vite-plugin=1.70.0 devDependencies.wrangler=4.157.0 dependencies.react=19.3.1 dependencies.react-dom=19.3.1
          case "$BUNDLER" in
            current-vinext) npm pkg set devDependencies.vinext=1.4.3 devDependencies.@vitejs/plugin-rsc=0.5.38 devDependencies.@vitejs/plugin-react=6.2.1 ;;
            root-worker-chunks)
              python - <<'PY'
          import pathlib
          p = pathlib.Path("vite.config.ts")
          text = p.read_text()
          p.write_text(text.replace("  return {\n", """  return {
              environments: {
                rsc: {
                  build: {
                    // The RSC manifest sidecars are emitted beside the server entry.
                    rolldownOptions: { output: { chunkFileNames: "[name]-[hash].js" } },
                  },
                },
              },
          """, 1))
          PY
              ;;
          esac
          npm install --package-lock-only --ignore-scripts --no-audit
          npm update zod fast-uri --package-lock-only --ignore-scripts --no-audit
          (cd gateway && go get golang.org/x/net@v0.62.0 && go mod tidy)
      - name: Retain the manifests and generated locks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: november-manifests-${{ matrix.bundler }}
          path: |
            package.json
            package-lock.json
            gateway/go.mod
            gateway/go.sum
            vite.config.ts
          if-no-files-found: error
          retention-days: 1
      - name: Print a transport copy of the dependency patch
        run: git diff -- package.json package-lock.json gateway/go.mod gateway/go.sum vite.config.ts | gzip -n | base64 | sed 's/^/SNOWBALL_LOCK_PATCH /'
      - name: Audit resolved npm locks
        run: npm audit --audit-level=high
      - name: Verify the local Node entry
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm test
