name: Prepare release artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing coordinated prerelease tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  packages:
    name: Firmware and platform review bundles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
      - name: Validate coordinated tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
      - name: Build locked ESP32-S3 firmware
        run: docker run --rm -v "$PWD:/repo" -w /repo/firmware/esp32-s3-audio espressif/idf:v5.5.5 bash -lc 'source /opt/esp/idf/export.sh && idf.py -D SDKCONFIG=$PWD/build-release/sdkconfig -D SDKCONFIG_DEFAULTS=$PWD/sdkconfig.defaults -B build-release build && python /repo/tools/collect-idf-notices.py /opt/esp/idf build-release/idf-notices'
      - name: Package approved firmware and all Gateway platforms
        env:
          SNOWBALL_IDF_NOTICE_DIR: firmware/esp32-s3-audio/build-release/idf-notices
        run: |
          node tools/package-firmware-release.mjs
          node tools/package-gate-release.mjs
      - name: Generate npm runtime SBOM
        run: |
          npm ci --ignore-scripts
          npm sbom --sbom-format cyclonedx --omit=dev > artifacts/releases/npm-runtime-sbom.cdx.json
      - name: Upload review artifacts (no release/image publication)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-review
          path: |
            artifacts/releases/*.tar.gz
            artifacts/releases/*.zip
            artifacts/releases/*.sha256
            artifacts/releases/*.cdx.json
          retention-days: 14
  verify:
    name: Verify artifact upload and download roundtrip
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - name: Download the exact review bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-review
          path: review
      - name: Verify firmware and every platform checksum
        working-directory: review
        run: |
          test "$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l)" = 5
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          jq -e '.bomFormat == "CycloneDX"' npm-runtime-sbom.cdx.json
