name: Security gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build, lint, and audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Block vulnerable runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Build and test
        run: npm test

  gateway:
    name: Gateway test, vet, and vulnerability scan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache-dependency-path: gateway/go.sum
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

  firmware:
    name: ESP32-S3 firmware build
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build the locked ESP-IDF project
        working-directory: firmware/esp32-s3-audio
        run: |
          idf.py set-target esp32s3
          idf.py build

  image:
    name: Container build and scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build container
        run: docker build --tag snowball-voice:ci .
      - name: Scan image for high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: snowball-voice:ci
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,secret,misconfig
