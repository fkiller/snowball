name: Security gate

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out all history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
      - name: Install and run pinned Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git . --redact --log-opts=--all

  web:
    name: Web build, lint, and audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Block vulnerable runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Build and test
        run: npm test
      - name: Check documentation links
        run: node tools/check-doc-links.mjs
      - name: Verify migration rollback with mocked daemons
        run: sudo env PATH="$PATH" node --test tests/migration.test.mjs
      - name: Block vulnerable development dependencies
        run: npm audit --audit-level=high

  gateway:
    name: Gateway test, vet, and vulnerability scan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache-dependency-path: gateway/go.sum
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

  firmware:
    name: ESP32-S3 firmware build
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build the locked ESP-IDF project
        working-directory: firmware/esp32-s3-audio
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build

  image:
    name: ${{ matrix.arch }} container build, scan, and isolated smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            runner: ubuntu-24.04-arm
          - arch: AMD64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build container
        run: docker build --network host --tag snowball-voice:ci .
      - name: Scan image for high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: snowball-voice:ci
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,secret,misconfig
      - name: Isolated authentication and media lifecycle smoke
        run: SNOWBALL_QA_IMAGE=snowball-voice:ci ./tools/run-qa-browser-smoke.sh
      - name: Generate image SBOM
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0 image --format cyclonedx --output /dev/stdout snowball-voice:ci > image-sbom.cdx.json
      - name: Retain image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-sbom-${{ matrix.arch }}
          path: image-sbom.cdx.json
      - name: Retain synthetic QA screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-QA-${{ matrix.arch }}
          path: artifacts/qa/**/*.png
          retention-days: 7
